<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Maze</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f0;
      --surface: #eeeae1;
      --surface2: #e4dfd4;
      --border: rgba(0,0,0,0.15);
      --border2: rgba(0,0,0,0.25);
      --text: #1a1814;
      --text2: #5a5650;
      --text3: #999490;
      --danger: #a32d2d;
      --success: #0f6e56;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1814;
        --surface: #242018;
        --surface2: #2e291f;
        --border: rgba(255,255,255,0.12);
        --border2: rgba(255,255,255,0.22);
        --text: #f0ece3;
        --text2: #a09a90;
        --text3: #605a52;
        --danger: #f09595;
        --success: #5DCAA5;
      }
    }

    body {
      background-image: url('media/runescape-bg-clean.gif');
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-size: 100% 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
        align-items: flex-start;
      }
    }

    /* ── Width: ~70% of viewport, capped so ultra-wide screens don't stretch it ── */
    .maze-wrap {
      width: 70%;
      max-width: 820px;
      min-width: 300px;
    }

    .maze-header {
      font-family: 'VT323', monospace;
      font-size: 52px;
      color: var(--text);
      text-align: center;
      letter-spacing: 4px;
      line-height: 1;
      margin-bottom: 6px;
    }

    @media (max-width: 600px) {
      .maze-header { font-size: 36px; letter-spacing: 2px; }
    }

    .maze-sub {
      text-align: center;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 2rem;
      font-style: italic;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: var(--text3);
      margin-bottom: 1rem;
      flex-wrap: wrap;
      min-height: 26px;
    }

    .crumb {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 4px;
      padding: 2px 8px;
    }

    .crumb-sep { color: var(--text3); font-size: 12px; }

    /* Scene card */
    .scene-box {
      background: var(--surface);
      border: 0.5px solid var(--border2);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 1rem;
      position: relative;
    }

    .scene-depth {
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: var(--text3);
      position: absolute;
      top: 14px;
      right: 16px;
      letter-spacing: 1px;
      z-index: 4;
      background: var(--surface);
      padding: 0 4px;
      border-radius: 3px;
    }

    /* Image wrapper — height is driven entirely by the image's natural aspect ratio */
    .scene-img-wrap {
      width: 100%;
      position: relative;
      background: #1a1814;
      -webkit-touch-callout: none;
      user-select: none;
    }

    .scene-img-wrap img {
      width: 100%;
      height: auto;   /* natural aspect ratio, never clipped */
      display: block;
      -webkit-touch-callout: none;
      user-select: none;
    }

    .img-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: #5a5650;
      font-family: 'VT323', monospace; font-size: 15px; letter-spacing: 1px;
    }

    .img-placeholder svg { opacity: 0.0; }

    /* Hotspot SVG — sits over the image, % coords via viewBox */
    #hotspot-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    /* Floating label tooltip */
    #hs-tooltip {
      position: absolute;
      z-index: 5;
      font-family: 'VT323', monospace;
      font-size: 30px;
      letter-spacing: 1px;
      background: rgba(10, 8, 6, 0.88);
      color: #f0ece3;
      padding: 4px 14px 5px;
      border-radius: 4px;
      pointer-events: none;
      white-space: normal;
      max-width: min(320px, 85%);
      text-align: center;
      line-height: 1.2;
      transform: translate(-50%, calc(-100% - 10px));
      display: none;
      border: 0.5px solid rgba(255,255,255,0.12);
    }

    @media (max-width: 600px) {
      #hs-tooltip {
        font-size: 20px;
        transform: translateX(-50%);
        max-width: 88%;
      }
    }

    #hs-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'VT323', monospace;
      font-size: 14px;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.28);
      z-index: 3;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* Scene text */
    .scene-body { padding: 1.25rem 1.75rem 1.75rem; }

    @media (max-width: 600px) {
      .scene-body { padding: 0.75rem 1rem 1rem; }
    }

    .scene-text { font-size: 19px; line-height: 1.65; color: var(--text); }
    .scene-text.dead { color: var(--danger); font-style: italic; }
    .scene-text.win  { color: var(--success); }

    @media (max-width: 600px) {
      .scene-text { font-size: 16px; }
    }

    /* Button row */
    .btn-row {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      font-family: 'VT323', monospace;
      font-size: 20px;
      letter-spacing: 1px;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .nav-btn:hover { background: var(--surface); color: var(--text); }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }
    .nav-btn.back-btn { color: var(--text3); }
    .nav-btn.back-btn:not(:disabled):hover { color: var(--text); }

    /* Touch ripple */
    .hs-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.0);
      transform: scale(0);
      animation: ripple-anim 0.45s ease-out forwards;
      pointer-events: none;
      z-index: 6;
    }
    @keyframes ripple-anim {
      to { transform: scale(3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="maze-wrap">
    <div class="maze-header">Gender Adventure!!</div>
    <div class="maze-sub">Click on what you see.</div>

    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="scene-box fade-in" id="scene-box">
      <span class="scene-depth" id="depth-label">DEPTH 0</span>

      <div class="scene-img-wrap" id="scene-img-wrap">
        <div class="img-placeholder" id="scene-placeholder">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          SCENE IMAGE
        </div>
        <img id="scene-img" src="" alt="scene" style="display:none;" />

        <svg id="hotspot-svg"
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
          style="pointer-events:none;"></svg>

        <div id="hs-tooltip"></div>
        <div id="hs-hint">tap to explore</div>
      </div>

      <div class="scene-body">
        <div class="scene-text" id="scene-text"></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="nav-btn back-btn" id="back-btn" onclick="goBack()">← Go Back</button>
      <button class="nav-btn" id="restart-btn" onclick="restart()" style="display:none;">↺ Start Over</button>
    </div>
  </div>

  <script src="maze.js"></script>

  <script>
    let current = tree;
    let navHistory = [];
    let path    = [];
    let hinted  = false;

    function navigateTo(hs) {
      navHistory.push({ node: current, label: hs.label.length > 16 ? hs.label.slice(0, 14) + '…' : hs.label });
      path.push(hs.label.length > 16 ? hs.label.slice(0, 14) + '…' : hs.label);
      current = hs.next;
      render();
    }

    function goBack() {
      if (navHistory.length === 0) {
        restart();
        return;
      }
      const prev = navHistory.pop();
      path.pop();
      current = prev.node;
      render();
    }

    function restart() {
      current    = tree;
      navHistory = [];
      path       = [];
      hinted     = false;
      render();
    }

    function render() {
      const box = document.getElementById('scene-box');
      box.classList.remove('fade-in');
      void box.offsetWidth;
      box.classList.add('fade-in');

      document.getElementById('depth-label').textContent = 'DEPTH ' + path.length;

      const img         = document.getElementById('scene-img');
      const placeholder = document.getElementById('scene-placeholder');
      if (current.img) {
        img.src            = current.img;
        img.style.display  = 'block';
        placeholder.style.display = 'none';
      } else {
        img.style.display  = 'none';
        placeholder.style.display = 'flex';
      }

      const st = document.getElementById('scene-text');
      if (current.dead) {
        st.className  = 'scene-text dead';
        st.textContent = '💀 ' + (current.deathText || current.text);
      } else if (current.win) {
        st.className  = 'scene-text win';
        st.textContent = '✨ ' + (current.winText || current.text);
      } else {
        st.className  = 'scene-text';
        st.textContent = current.text;
      }

      // Back button
      const backBtn = document.getElementById('back-btn');
      if (navHistory.length === 0) {
        backBtn.textContent = '↺ Start Over';
        backBtn.style.opacity = '0.4';
        backBtn.style.cursor = 'default';
      } else {
        backBtn.textContent = '← Go Back';
        backBtn.style.opacity = '1';
        backBtn.style.cursor = 'pointer';
      }

      // Start Over button — only on terminal states
      const restartBtn = document.getElementById('restart-btn');
      restartBtn.style.display = (current.dead || current.win) ? 'block' : 'none';

      buildHotspots();

      const bc = document.getElementById('breadcrumb');
      bc.innerHTML = path.length
        ? path.map(p => `<span class="crumb">${p}</span>`).join('<span class="crumb-sep"> › </span>')
        : '';
    }

function buildHotspots() {
  const svg     = document.getElementById('hotspot-svg');
  const tooltip = document.getElementById('hs-tooltip');
  const hint    = document.getElementById('hs-hint');
  svg.innerHTML = '';
  tooltip.style.display = 'none';

  const hotspots = (current.hotspots || []).filter(hs => hs.next);

  if (current.dead || current.win || hotspots.length === 0) {
    svg.style.pointerEvents = 'none';
    hint.style.opacity = '0';
    return;
  }

  svg.style.pointerEvents = 'all';
  hint.style.opacity = hinted ? '0' : '1';

  // Build rects — mouse events stay per-hotspot, touch is handled at SVG level
  hotspots.forEach(hs => {
    const [x, y, w, h] = hs.region;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.cursor = 'pointer';

    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('rx', '0.6');
    rect.setAttribute('fill', 'rgba(255,255,255,0)');
    rect.setAttribute('stroke', 'rgba(255,255,255,0)');
    rect.setAttribute('stroke-width', '0.0');
    rect.style.transition = 'fill 0.12s, stroke 0.12s';

    g.appendChild(rect);
    svg.appendChild(g);

    g.addEventListener('mouseenter', e => {
      hint.style.opacity = '0';
      hinted = true;
      tooltip.textContent   = hs.label;
      tooltip.style.display = 'block';
      moveTooltip(e);
    });

    g.addEventListener('mousemove', moveTooltip);

    g.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });

    g.addEventListener('click', () => {
      tooltip.style.display = 'none';
      navigateTo(hs);
    });
  });

  // ── Touch: drag-to-explore, lift-to-activate ──────────────────────────────
  // All touch events live on the SVG so the finger can roam freely across
  // hotspot boundaries without triggering per-element enter/leave chaos.

  let activeHotspot = null;

  function hotspotAtTouch(touch) {
    const wrap = document.getElementById('scene-img-wrap');
    const r    = wrap.getBoundingClientRect();
    // Map pixel position → SVG viewBox coords (0–100)
    const sx = (touch.clientX - r.left)  / r.width  * 100;
    const sy = (touch.clientY - r.top)   / r.height * 100;
    return hotspots.find(hs => {
      const [x, y, w, h] = hs.region;
      return sx >= x && sx <= x + w && sy >= y && sy <= y + h;
    }) ?? null;
  }

  svg.addEventListener('touchstart', e => {
    e.preventDefault();          // block scroll + ghost click
    hinted = true;
    hint.style.opacity = '0';
    const touch = e.touches[0];
    activeHotspot = hotspotAtTouch(touch);
    tooltip.style.display = 'none';
    if (activeHotspot) {
      tooltip.textContent     = activeHotspot.label;
      tooltip.style.display   = 'block';
      tooltip.style.left      = '50%';
      tooltip.style.top       = '14px';
      tooltip.style.transform = 'translateX(-50%)';
    } else {
      tooltip.style.display = 'none';
    }
  }, { passive: false });

  svg.addEventListener('touchmove', e => {
    e.preventDefault();
    const touch = e.touches[0];
    const found = hotspotAtTouch(touch);

    if (found !== activeHotspot) {
      activeHotspot = found;
      if (found) {
        tooltip.textContent     = found.label;
        tooltip.style.display   = 'block';
        tooltip.style.left      = '50%';
        tooltip.style.top       = '14px';
        tooltip.style.transform = 'translateX(-50%)';
        spawnRipple(touch, document.getElementById('scene-img-wrap'));
      } else {
        tooltip.style.display = 'none';
      }
    }
  }, { passive: false });

  svg.addEventListener('touchend', e => {
    e.preventDefault();
    tooltip.style.display   = 'none';
    tooltip.style.transform = '';
    if (activeHotspot) {
      const target  = activeHotspot;
      activeHotspot = null;
      navigateTo(target);
    }
  }, { passive: false });

  svg.addEventListener('touchcancel', () => {
    activeHotspot           = null;
    tooltip.style.display   = 'none';
    tooltip.style.transform = '';
  });
}

    function moveTooltip(e) {
      const tooltip = document.getElementById('hs-tooltip');
      const wrap    = document.getElementById('scene-img-wrap');
      const r       = wrap.getBoundingClientRect();
      const x       = e.clientX - r.left;
      const y       = e.clientY - r.top;
  
      tooltip.style.left = Math.min(Math.max(x, 60), r.width - 60) + 'px';
      tooltip.style.top  = y + 'px';
  
      // Flip below cursor if tooltip would go above the image top
      const tipHeight = tooltip.offsetHeight;
      const gap = 10;
      if (y - tipHeight - gap < 0) {
        tooltip.style.transform = 'translate(-50%, ' + gap + 'px)';
      } else {
        tooltip.style.transform = 'translate(-50%, calc(-100% - ' + gap + 'px))';
      }
    }

    function spawnRipple(touch, container) {
      const r   = container.getBoundingClientRect();
      const x   = touch.clientX - r.left;
      const y   = touch.clientY - r.top;
      const dot = document.createElement('div');
      dot.className = 'hs-ripple';
      dot.style.width  = '40px';
      dot.style.height = '40px';
      dot.style.left   = (x - 20) + 'px';
      dot.style.top    = (y - 20) + 'px';
      container.appendChild(dot);
      dot.addEventListener('animationend', () => dot.remove());
    }

    render();
  </script>
</body>
</html>
